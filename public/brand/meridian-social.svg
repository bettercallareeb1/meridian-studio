<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Meridian Studio OS — Creative studio resource and production workspace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171C"/>
      <stop offset="0.6" stop-color="#0D0D10"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="70" r="330" fill="none" stroke="#6366F1" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="1080" cy="70" r="470" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="2"/>

  <g transform="translate(80 70)">
    <rect width="64" height="64" rx="16" fill="#F4F4F5"/>
    <path d="M18 46V20L32 38L46 20V46" fill="none" stroke="#111114" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="14" r="4.5" fill="#4F46E5"/>
    <text x="84" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#F4F4F5" letter-spacing="-0.3">Meridian</text>
    <text x="84" y="49" font-family="Consolas, monospace" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="2.6">STUDIO OS</text>
  </g>

  <g transform="translate(80 235)">
