      <tspan x="0" y="88">for multidisciplinary teams.</tspan>
    </text>
    <text x="0" y="164" font-family="Consolas, monospace" font-size="19" font-weight="500" fill="#A5B4FC" letter-spacing="2.2">PROJECTS · DELIVERABLES · CAPACITY · TEAM</text>
  </g>

  <g transform="translate(80 548)">
    <line x1="0" y1="-24" x2="1040" y2="-24" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <text font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#71717A">Creative studio resource &amp; production workspace</text>
    <text x="1040" y="0" text-anchor="end" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#71717A" letter-spacing="1.8">Q2 · 2026</text>
  </g>

  <g transform="translate(1030 420) scale(0.55)" opacity="0.95">
